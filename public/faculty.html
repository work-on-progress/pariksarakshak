<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console — PariksaRakshak</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./"><img src="assets/logo-mark.svg" alt=""><b>Pariksa<i>Rakshak</i></b></a>
    <span class="tag" id="instituteTag">Console</span>
    <span class="spacer"></span>
    <span class="meta" id="whoami"></span>
    <button class="btn ghost small" id="signOutBtn">Sign out</button>
  </div>
</header>

<main class="console">
  <div class="console-grid">

    <!-- ══════ LEFT COLUMN ══════ -->
    <div class="stack">

      <!-- Papers -->
      <section class="panel">
        <div class="panel-head">
          <h2>Papers</h2>
          <span class="eyebrow" id="examCount"></span>
        </div>
        <div class="panel-body">
          <div class="row">
            <label class="field"><span>Title</span>
              <input id="title" placeholder="Virtualization Technology — Unit 1">
            </label>
            <label class="field"><span>Exam code</span>
              <input id="code" placeholder="CSE423-U1" style="text-transform:uppercase">
            </label>
          </div>
          <div class="row-3">
            <label class="field"><span>Opens</span><input id="starts" type="datetime-local"></label>
            <label class="field"><span>Closes</span><input id="ends" type="datetime-local"></label>
            <label class="field"><span>Minutes allowed</span><input id="dur" type="number" value="60" min="5"></label>
          </div>
          <button class="btn" id="createExam">Create paper</button>
          <p id="examMsg" class="notice hidden" style="margin-top:.8rem"></p>

          <div id="examList" style="margin-top:1.2rem"></div>
        </div>
      </section>

      <!-- Question authoring -->
      <section class="panel">
        <div class="panel-head">
          <h2>Write questions</h2>
          <span class="eyebrow">Drafted by Gemini, approved by you</span>
        </div>
        <div class="panel-body">
          <label class="field"><span>Add to paper</span>
            <select id="examSelect"></select>
          </label>
          <label class="field"><span>Topic</span>
            <input id="topic" placeholder="SQL indexing and query optimisation">
          </label>
          <label class="field"><span>Lecture notes (optional — questions stay inside this text)</span>
            <textarea id="sourceText" rows="4" placeholder="Paste the unit notes here."></textarea>
          </label>
          <div class="row-4">
            <label class="field"><span>MCQ</span><input id="nMcq" type="number" value="5" min="0" max="20"></label>
            <label class="field"><span>Blanks</span><input id="nCloze" type="number" value="2" min="0" max="10"></label>
            <label class="field"><span>Long</span><input id="nLong" type="number" value="1" min="0" max="5"></label>
            <label class="field"><span>Coding</span><input id="nCode" type="number" value="2" min="0" max="5"></label>
          </div>
          <div style="display:flex;gap:.6rem;flex-wrap:wrap">
            <button class="btn" id="genBtn">Draft questions</button>
            <button class="btn pass hidden" id="saveBtn">Save to paper</button>
            <button class="btn ghost hidden" id="clearBtn">Discard draft</button>
          </div>
          <p id="genMsg" class="notice hidden" style="margin-top:.8rem"></p>
          <div id="preview" style="margin-top:1.1rem"></div>
        </div>
      </section>
    </div>

    <!-- ══════ RIGHT COLUMN ══════ -->
    <div class="stack">

      <!-- Live invigilation -->
      <section class="panel">
        <div class="panel-head">
          <h2>The room</h2>
          <span class="eyebrow" id="liveState">connecting…</span>
        </div>
        <div class="panel-body">
          <div id="feed" class="feed">
            <p class="feed-empty">Nothing to report. Incidents appear here the moment they happen.</p>
          </div>
        </div>
      </section>

      <!-- Results -->
      <section class="panel">
        <div class="panel-head">
          <h2>Results</h2>
          <button class="btn ghost small" id="exportBtn" style="margin-left:auto">Export CSV</button>
        </div>
        <div class="panel-body">
          <label class="field"><span>Paper</span><select id="resultExam"></select></label>
          <div id="resultsTable"></div>
        </div>
      </section>
    </div>
  </div>
</main>

<script type="module" src="js/faculty.js"></script>
</body>
</html>
